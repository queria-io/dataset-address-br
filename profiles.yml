address_br:
  target: default
  outputs:
    default:
      type: duckdb
      path: ":memory:"
      database: address_br
      schema: main
      threads: 1
      # mart_parcel は約 2 億行を結合して並べ替える。path が :memory: のままだと DuckDB は
      # メモリに入らない分をディスクに逃がせず、Actions のランナー (16GB) で Out of Memory になる。
      # 逃がす先を決め、上限をほかの処理の分だけ下げる。並べる順は各モデルの ORDER BY が決めるので
      # preserve_insertion_order は切ってよい (切ると並べ替えと結合のメモリが減る)
      settings:
        memory_limit: "10GB"
        preserve_insertion_order: false
      # ビルドが公開ストレージを読むときの名乗り。build-fdl.sh が
      # queria-build として渡す。無いと data.queria.io の利用統計に
      # 自分のビルドが利用者として混ざる。
      # settings: ではなく config_options: — custom_user_agent は接続を開く
      # ときにしか決められず、SET では変えられない
      config_options:
        custom_user_agent: "{{ env_var('QUERIA_USER_AGENT', '') }}"
        # 逃がす先は使い始めたあとに変えられない。settings に置くと dbt-duckdb がモデルごとに
        # SET し直して "Cannot switch temporary directory" で止まるので、接続を開くときに 1 回だけ決める
        temp_directory: "{{ env_var('RUNNER_TEMP', '/tmp') }}/duckdb_tmp"
      extensions:
        - httpfs
        - ducklake
        - sqlite
        - spatial
      attach:
        # fdl checkout が作った作業場のカタログ (SQLite) に書く。新しいデータファイルは
        # FDL_DATA_PATH (data.queria.io から取り出したときは手元のフォルダ) に書き、
        # fdl commit が上げる (shared/scripts/build-fdl.sh)
        - path: "ducklake:{{ env_var('FDL_WORKING') }}"
          alias: address_br
          is_ducklake: true
          options:
            DATA_PATH: "{{ env_var('FDL_DATA_PATH') }}"
            OVERRIDE_DATA_PATH: true
            META_TYPE: "'sqlite'"
            # 既定のままだと小さいテーブルがカタログの中に収まり parquet が
            # 1 つも生成されない。fdl commit はインライン化された行を断るので、常に切る
            DATA_INLINING_ROW_LIMIT: 0
