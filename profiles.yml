address_br:
  target: default
  outputs:
    default:
      type: duckdb
      path: ":memory:"
      database: address_br
      schema: main
      threads: 1
      # mart_parcel は約 2 億行を結合して並べ替える。path が :memory: のままだと DuckDB は
      # メモリに入らない分をディスクに逃がせず、Actions のランナー (16GB) で Out of Memory になる。
      # 逃がす先を決め、上限をほかの処理の分だけ下げる。並べる順は各モデルの ORDER BY が決めるので
      # preserve_insertion_order は切ってよい (切ると並べ替えと結合のメモリが減る)
      settings:
        temp_directory: "{{ env_var('RUNNER_TEMP', '/tmp') }}/duckdb_tmp"
        memory_limit: "10GB"
        preserve_insertion_order: false
      # ビルドが公開ストレージを読むときの名乗り。queria run が
      # queria-build として渡す。無いと data.queria.io の利用統計に
      # 自分のビルドが利用者として混ざる。
      # settings: ではなく config_options: — custom_user_agent は接続を開く
      # ときにしか決められず、SET では変えられない
      config_options:
        custom_user_agent: "{{ env_var('QUERIA_USER_AGENT', '') }}"
      extensions:
        - httpfs
        - ducklake
        # credential_chain はこの拡張にある
        - aws
        - spatial
      # 認証情報を値として持たず、期限が切れたら取り直させる。一時認証情報は
      # 15 分で切れるのに対しビルドはそれより長く走るので、値を渡す形にすると
      # 途中で書けなくなる。process が実行するのは queria で、鍵はどこにも置かない
      secrets:
        - type: s3
          provider: credential_chain
          chain: process
          refresh: auto
          endpoint: "{{ env_var('QUERIA_S3_ENDPOINT_HOST', '') }}"
          url_style: path
          region: "{{ env_var('QUERIA_S3_REGION', 'auto') }}"
          use_ssl: "{{ env_var('QUERIA_S3_USE_SSL', 'true') }}"
      attach:
        - path: "ducklake:{{ env_var('QUERIA_CATALOG_PATH', '') }}"
          alias: address_br
          is_ducklake: true
          options:
            DATA_PATH: "{{ env_var('QUERIA_DATA_URL', '') }}"
            OVERRIDE_DATA_PATH: true
            META_TYPE: "'sqlite'"
            # 既定のままだと小さいテーブルがカタログの中に収まり parquet が
            # 1 つも生成されない。データファイルの無いデータセットが公開されるので、常に切る
            DATA_INLINING_ROW_LIMIT: 0
