version: 2

models:
  - name: mart_rsdtdsp_blk
    description: |
      住居表示を実施している町字の街区（「○丁目1番」の「1番」）と、その代表点。
      「アドレス・ベース・レジストリ（住居表示-街区マスタデータ・位置参照拡張）」（デジタル庁）（https://dataset.address-br.digital.go.jp/）を加工して作成。
    access: public
    columns:
      - name: lg_code
        data_type: varchar
      - name: machiaza_id
        data_type: varchar
      - name: blk_id
        data_type: varchar
      - name: blk_num
        data_type: varchar
      - name: geometry
        data_type: geometry
