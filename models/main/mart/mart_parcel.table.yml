schema: main
name: mart_parcel
title: 地番マスタ
description: |-
  地番（「○番地」「○番○」）の一覧と、座標の付く筆の代表点です。

  - 座標が付くのは一部の筆だけです（日野市で 10%、千代田区で 1%）
keywords:
  - 住所
  - 地番
  - 位置参照
sources:
  - path: https://dataset.address-br.digital.go.jp/
fields:
  - name: lg_code
    title: 全国地方公共団体コード
    description: 6桁（検査数字あり）
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: machiaza_id
    title: 町字ID
    description: mart_town と lg_code・machiaza_id で結合する
  - name: prc_id
    title: 地番ID
  - name: prc_num1
    title: 地番1
    description: 地番の本番。イロハなどの頭の文字を含むことがある（元データのまま、半角カナもそのまま）
  - name: prc_num2
    title: 地番2
    description: 枝番。無ければ NULL
  - name: prc_num3
    title: 地番3
    description: 枝番の枝番。無ければ NULL
  - name: rsdt_addr_flg
    title: 住居表示フラグ
    description: 1 は住居表示を実施している町字の地番
  - name: geometry
    title: 代表点
    description: 代表点（経緯度、JGD2011、変換していない）。無ければ NULL
