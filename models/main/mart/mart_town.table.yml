schema: main
name: mart_town
title: 町字マスタ
description: |-
  全国の町字（大字・町・丁目・小字）のマスタです。名称・カナ・郵便番号・住居表示の実施の有無・代表点を持ちます。

  - 丁目の表記は市区町村ごとに違います（「１丁目」「三丁目」）。住所の文字列と照合するときは正規化してください
  - 代表点が無い町字（主に小字）は geometry が NULL です
keywords:
  - マスタ
  - 町字
  - 住所
sources:
  - path: https://dataset.address-br.digital.go.jp/documents/b80e77a0e2d24e5692be4af885eb3de7/about
fields:
  - name: lg_code
    title: 全国地方公共団体コード
    description: 6桁（検査数字あり）
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: machiaza_id
    title: 町字ID
  - name: machiaza_type
    title: 町字区分コード
  - name: pref_code
    title: 都道府県コード
    description: 2桁
    annotations: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: pref_name
    title: 都道府県名
  - name: pref_name_kana
    title: 都道府県名（カナ）
  - name: county_name
    title: 郡名
  - name: city_name
    title: 市区町村名
  - name: city_name_kana
    title: 市区町村名（カナ）
  - name: ward_name
    title: 行政区名
    description: 政令指定都市のみ（他は NULL）
  - name: ward_name_kana
    title: 行政区名（カナ）
  - name: oaza_cho
    title: 大字・町名
  - name: oaza_cho_kana
    title: 大字・町名（カナ）
  - name: chome
    title: 丁目名
  - name: chome_number
    title: 丁目番号
  - name: koaza
    title: 小字名
  - name: koaza_kana
    title: 小字名（カナ）
  - name: post_code
    title: 郵便番号
    annotations: { queria: { semantic: { role: entity, name: postal_code } } }
  - name: efct_date
    title: 効力発生日
  - name: rsdt_addr_flg
    title: 住居表示フラグ
    description: 1=住居表示を実施している町字、0=地番で表す町字
  - name: wake_num_flg
    title: 起番フラグ
    description: 1=起番（この町字で地番が振られている）、2=非起番、0=登記情報に無い
  - name: koaza_aka_code
    title: 小字の種類のコード
    description: 2 は京都の通り名（このとき koaza に「寺町通御池上る」のような通り名が入る）
  - name: machiaza_dist
    title: 同じ名前の町字の区別
    description: 同じ市区町村に同じ名前の町字があるときに、どれかを見分けるための文字列（住所の表記には含まれない）
  - name: status_flg
    title: 状態フラグ
    description: 0 は自治体の確認待ち、1 は自治体が確認したもの、2 は確認の要らないもの、3 は存在しない町字
  - name: oaza_cho_uncmn_reg
    title: 大字・町外字 正規化
  - name: oaza_cho_uncmn_mj
    title: 大字・町外字 明治
  - name: oaza_cho_uncmn_type
    title: 大字・町外字 種別
  - name: oaza_cho_uncmn_code
    title: 大字・町外字 コード
  - name: koaza_uncmn_reg
    title: 小字外字 正規化
  - name: koaza_uncmn_mj
    title: 小字外字 明治
  - name: koaza_uncmn_type
    title: 小字外字 種別
  - name: koaza_uncmn_code
    title: 小字外字 コード
  - name: alias_oaza
    title: 大字・町通称名
  - name: alias_oaza_kana
    title: 大字・町通称名（カナ）
  - name: alias_oaza_roma
    title: 大字・町通称名（ローマ字）
  - name: alias_koaza
    title: 小字通称名
  - name: alias_koaza_kana
    title: 小字通称名（カナ）
  - name: alias_koaza_roma
    title: 小字通称名（ローマ字）
  - name: geometry
    title: 代表点
    description: 代表点（経緯度、JGD2011 と JGD2000 が混在、変換していない）。無ければ NULL
