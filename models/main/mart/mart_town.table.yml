schema: main
name: mart_town
title: 町字マスタ
description: '全国の町字マスタ。

  「アドレス・ベース・レジストリ（町字マスタデータ）」（デジタル庁）（https://dataset.address-br.digital.go.jp/）を加工して作成。'
keywords:
  - マスタ
  - 町字
  - 住所
sources:
  - path: https://dataset.address-br.digital.go.jp/documents/b80e77a0e2d24e5692be4af885eb3de7/about
fields:
  - name: lg_code
    title: 全国地方公共団体コード
    description: 6桁（検査数字あり）
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: machiaza_id
    title: 町字ID
  - name: machiaza_type
    title: 町字区分コード
  - name: pref_code
    title: 都道府県コード
    description: 2桁
    annotations: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: pref_name
    title: 都道府県名
  - name: pref_name_kana
    title: 都道府県名（カナ）
  - name: county_name
    title: 郡名
  - name: city_name
    title: 市区町村名
  - name: city_name_kana
    title: 市区町村名（カナ）
  - name: ward_name
    title: 行政区名
    description: 政令指定都市のみ（他は NULL）
  - name: ward_name_kana
    title: 行政区名（カナ）
  - name: oaza_cho
    title: 大字・町名
  - name: oaza_cho_kana
    title: 大字・町名（カナ）
  - name: chome
    title: 丁目名
  - name: chome_number
    title: 丁目番号
  - name: koaza
    title: 小字名
  - name: koaza_kana
    title: 小字名（カナ）
  - name: post_code
    title: 郵便番号
    annotations: { queria: { semantic: { role: entity, name: postal_code } } }
  - name: efct_date
    title: 効力発生日
  - name: rsdt_addr_flg
    title: 住居表示フラグ
    description: 1 は住居表示を実施している町字（街区・住居は mart_rsdtdsp_blk / mart_rsdtdsp_rsdt にある）、0 は地番で表す町字
  - name: wake_num_flg
    title: 起番フラグ
    description: 町字が地番区域かどうか。1 は起番（この町字で地番が振られている）、2 は非起番（この町字には地番が無い）、0 は登記情報に存在しない。小字が 1 なら地番はその小字の中でだけ一意で、小字を省いた地番の住所を大字で探すと別の小字の地番に当たりうる
  - name: koaza_aka_code
    title: 小字の種類のコード
    description: 2 は京都の通り名（このとき koaza に「寺町通御池上る」のような通り名が入る）
  - name: machiaza_dist
    title: 同じ名前の町字の区別
    description: 同じ市区町村に同じ名前の町字があるときに、どれかを見分けるための文字列（住所の表記には含まれない）
  - name: status_flg
    title: 状態フラグ
    description: 0 は自治体の確認待ち、1 は自治体が確認したもの、2 は確認の要らないもの、3 は存在しない町字
  - name: oaza_cho_uncmn_reg
    title: 大字・町外字 正規化
  - name: oaza_cho_uncmn_mj
    title: 大字・町外字 明治
  - name: oaza_cho_uncmn_type
    title: 大字・町外字 種別
  - name: oaza_cho_uncmn_code
    title: 大字・町外字 コード
  - name: koaza_uncmn_reg
    title: 小字外字 正規化
  - name: koaza_uncmn_mj
    title: 小字外字 明治
  - name: koaza_uncmn_type
    title: 小字外字 種別
  - name: koaza_uncmn_code
    title: 小字外字 コード
  - name: alias_oaza
    title: 大字・町通称名
  - name: alias_oaza_kana
    title: 大字・町通称名（カナ）
  - name: alias_oaza_roma
    title: 大字・町通称名（ローマ字）
  - name: alias_koaza
    title: 小字通称名
  - name: alias_koaza_kana
    title: 小字通称名（カナ）
  - name: alias_koaza_roma
    title: 小字通称名（ローマ字）
  - name: geometry
    title: 代表点
    description: '位置参照拡張の代表点座標（経緯度）。元データの測地系は JGD2011 (EPSG:6668) と JGD2000 (EPSG:4612) が混在し、変換していない。代表点の無い町字（主に小字）は NULL'
