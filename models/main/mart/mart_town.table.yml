  - name: oaza_cho_uncmn_type
    title: 大字・町外字 種別
  - name: oaza_cho_uncmn_code
    title: 大字・町外字 コード
  - name: koaza_uncmn_reg
    title: 小字外字 正規化
  - name: koaza_uncmn_mj
    title: 小字外字 明治
  - name: koaza_uncmn_type
    title: 小字外字 種別
  - name: koaza_uncmn_code
    title: 小字外字 コード
  - name: alias_oaza
    title: 大字・町通称名
  - name: alias_oaza_kana
    title: 大字・町通称名（カナ）
  - name: alias_oaza_roma
    title: 大字・町通称名（ローマ字）
  - name: alias_koaza
    title: 小字通称名
  - name: alias_koaza_kana
    title: 小字通称名（カナ）
  - name: alias_koaza_roma
    title: 小字通称名（ローマ字）
