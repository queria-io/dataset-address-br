schema: main
name: mart_rsdtdsp_blk
title: 住居表示 街区マスタ
description: '住居表示を実施している町字の街区（「○丁目1番」の「1番」）と、その代表点。

  「アドレス・ベース・レジストリ（住居表示-街区マスタデータ・位置参照拡張）」（デジタル庁）（https://dataset.address-br.digital.go.jp/）を加工して作成。'
keywords:
  - 住所
  - 住居表示
  - 街区
  - 位置参照
published: true
sources:
  - path: https://dataset.address-br.digital.go.jp/
fields:
  - name: lg_code
    title: 全国地方公共団体コード
    description: 6桁（検査数字あり）
    semantic: { role: entity, name: city }
  - name: machiaza_id
    title: 町字ID
    description: mart_town と lg_code・machiaza_id で結合する
  - name: blk_id
    title: 街区ID
  - name: blk_num
    title: 街区符号
    description: 住所の「○番」の部分
  - name: geometry
    title: 代表点
    description: '位置参照拡張の代表点座標（経緯度）。元データの測地系は JGD2000 (EPSG:4612)、変換していない。代表点が複数ある街区は平均。代表点の無い街区は NULL'
