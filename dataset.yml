spec_version: "0.1"
name: address_br
title: アドレス・ベース・レジストリ
description: |-
  「アドレス・ベース・レジストリ」（デジタル庁）（https://dataset.address-br.digital.go.jp/）を加工して作成。
  全国地方公共団体コード・都道府県・郡・市区町村・行政区の対応表と、町字・住居表示の街区・住居のマスタを代表点の座標つきで提供。
keywords:
  - 住所
  - マスタ
  - 地方公共団体コード
  - デジタル庁
  - 住居表示
  - 位置参照
homepage: https://github.com/queria-io/dataset-address-br
language: ja
themes: [land_climate]

licenses:
  - JP-DIGITAL-ADDRESS-BR

sources:
  - title: アドレス・ベース・レジストリ（デジタル庁）
    path: https://dataset.address-br.digital.go.jp/

contributors:
  - title: デジタル庁
    path: https://www.digital.go.jp/
    roles: [rightsHolder]

spatial_coverage: [JP]
update_frequency: monthly
cover: 🏛️

ai_context:
  instructions: |
    住所を都道府県・市区町村・町字に分けて正規化する、住所文字列から地域コードや座標を引く、
    町字単位で他のデータを集計する、といった住所の名寄せとジオコーディングに使う。
    都道府県47件、市区町村1918件、町字72万7396件、住居表示の街区92万4884件、住居2198万4788件。
    市区町村マスタは政令指定都市について市レベルと区レベルの両方の行を持つ。
    そのため単純に数えると市区町村の数（lg_code の1747）とは一致しない。
    政令指定都市の区のコードを持つのはこちらで、lg_code には区が入っていない。
    lg_code は6桁（チェックディジット付き）なので lg_code / zipcode / houjin_bangou と結合できる。
    座標は代表点（面ではなく点）で、geometry に持つ。町字の代表点は19万7363件で、大字・丁目の9割にあり、小字にはほとんど無い。
    住居表示を実施している町字（mart_town.rsdt_addr_flg = '1'）は、街区（mart_rsdtdsp_blk、「1番」）と
    住居（mart_rsdtdsp_rsdt、「3号」）まで座標を引ける。住居表示を実施しているのは675の市区町村。
    実施していない市区町村（地番で表す地域）は町字の代表点までしか引けない。
    結合キーは lg_code, machiaza_id（町字）、blk_id（街区）、rsdt_id, rsdt2_id（住居）。
    住所の「○番」は blk_num、「○号」は rsdt_num で、どちらも半角数字の文字列。
    町字の丁目は「１丁目」のように全角数字なので、住所文字列の「一丁目」「1丁目」とは正規化してから突合する。
    町字・街区・住居の表は lg_code の順に並んでいるので、lg_code で絞ると読む量が小さい。
    町字は表記の揺れ（丁目の有無、大字・字の扱い）が住所文字列との突合の難所になる。
    時点のスナップショットで、廃置分合の履歴は持たない。
  synonyms: [アドレス・ベース・レジストリ, ABR, 住所マスタ, 町字マスタ, 住居表示, ジオコーディング]
  examples:
    - 政令指定都市の区のコードを引きたい
    - 市区町村ごとの町字の数を出したい
    - 住所文字列を都道府県・市区町村・町字に分けたい
    - 住所から緯度経度を引きたい

schemas:
  - name: main
    title: メイン
