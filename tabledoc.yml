name: address_br
title: アドレス・ベース・レジストリ
description: |-
  デジタル庁のアドレス・ベース・レジストリの、都道府県・市区町村・町字のマスタと、住居表示の街区・住居、地番のマスタです。それぞれ代表点の座標を持ち、住所の正規化やジオコーディングに使えます。

  出典：「アドレス・ベース・レジストリ」（デジタル庁）を加工して作成。
